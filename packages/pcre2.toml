name = "pcre2"
version = "10.47"
release = 1
description = "Perl Compatible Regular Expressions library, version 2"
homepage = "https://github.com/PCRE2Project/pcre2"
license = "BSD-3-Clause"
source = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.47/pcre2-10.47.tar.gz"
sha256 = "c08ae2388ef333e8403e670ad70c0a11f1eed021fd88308d7e02f596fcd9dc16"
architectures = ["x86_64"]
depends = []
build_depends = [
    "gcc",
    "make"
]
[build]
system = "autotools"
configure = [
    "--prefix=/usr",
    "--enable-pcre2-8",
    "--enable-pcre2-16",
    "--enable-pcre2-32",
    "--enable-unicode"
]
